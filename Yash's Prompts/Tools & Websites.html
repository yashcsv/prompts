
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);font-size:14px;color:var(--color-text-primary)}
.wrap{padding:0 0 3rem}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:1rem 0 1.25rem}
.filters button{font-size:12px;padding:5px 12px;border-radius:100px;border:0.5px solid var(--color-border-secondary);background:transparent;color:var(--color-text-secondary);cursor:pointer;transition:all .15s}
.filters button.on{background:var(--color-text-primary);color:var(--color-background-primary);border-color:var(--color-text-primary)}
.search-bar{width:100%;padding:8px 12px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-primary);font-size:13px;margin-bottom:1rem;outline:none}
.search-bar:focus{border-color:var(--color-border-primary)}
.count{font-size:12px;color:var(--color-text-secondary);margin-bottom:0.75rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.card-name{font-size:13px;font-weight:500}
.badges{display:flex;flex-wrap:wrap;gap:4px}
.badge{font-size:10px;padding:2px 7px;border-radius:100px;font-weight:500;white-space:nowrap}
.free{background:#E1F5EE;color:#0F6E56}
.paid{background:#FCEBEB;color:#A32D2D}
.freemium{background:#FAEEDA;color:#854F0B}
.opensource{background:#E6F1FB;color:#185FA5}
.website{background:#EEEDFE;color:#3C3489}
.cat{font-size:10px;padding:2px 7px;border-radius:100px;background:var(--color-background-secondary);color:var(--color-text-secondary)}
.price{font-size:12px;font-weight:500;color:var(--color-text-primary)}
.desc{font-size:12px;color:var(--color-text-secondary);line-height:1.5}
.link{font-size:11px;color:#185FA5;text-decoration:none;margin-top:2px;display:inline-block}
.section-label{font-size:11px;font-weight:500;letter-spacing:.04em;color:var(--color-text-secondary);text-transform:uppercase;margin:1.5rem 0 0.5rem;padding-bottom:4px;border-bottom:0.5px solid var(--color-border-tertiary)}
.hidden{display:none}
</style>

<div class="wrap">

<div class="count" id="count"></div>
<div class="grid" id="grid"></div>
</div>

let activeFilter = 'all';
let searchVal = '';

function filter() {
  searchVal = document.getElementById('search').value.toLowerCase();
  render();
}

function toggleCat(cat, btn) {
  document.querySelectorAll('.filters button').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  activeFilter = cat;
  render();
}

function render() {
  const priceTypes = ['free','freemium','paid','opensource'];
  const catTypes = ['ai-coding','frontend','backend','devops','security','ai-ml','automation','monitoring','growth','web3'];

  let filtered = tools.filter(t => {
    const matchSearch = !searchVal || t.name.toLowerCase().includes(searchVal) || t.desc.toLowerCase().includes(searchVal) || t.cat.includes(searchVal);
    const matchFilter = activeFilter === 'all' || t.type === activeFilter || t.cat === activeFilter;
    return matchSearch && matchFilter;
  });

  const catLabels = {
    'ai-coding':'AI Coding','frontend':'Frontend / UI / Design','backend':'Backend / Database',
    'devops':'DevOps / Deployment','security':'Security / Auth','ai-ml':'AI / ML',
    'automation':'Automation / Ops','monitoring':'Monitoring / Debugging','growth':'Growth / Sales','web3':'Blockchain / Web3'
  };
  const typeLabel = {'free':'Free','freemium':'Freemium','paid':'Paid','opensource':'Open Source'};
  const typeClass = {'free':'free','freemium':'freemium','paid':'paid','opensource':'opensource'};

  document.getElementById('count').textContent = filtered.length + ' tools shown';

  let html = '';
  let groupBy = priceTypes.includes(activeFilter) ? 'cat' : (catTypes.includes(activeFilter) ? 'type' : 'cat');

  if(groupBy === 'cat') {
    const cats = [...new Set(filtered.map(t => t.cat))];
    cats.forEach(cat => {
      const items = filtered.filter(t => t.cat === cat);
      if(!items.length) return;
      html += `<div class="section-label">${catLabels[cat]||cat} (${items.length})</div><div class="grid">`;
      items.forEach(t => { html += cardHTML(t, typeLabel, typeClass); });
      html += '</div>';
    });
  } else {
    const types = [...new Set(filtered.map(t => t.type))];
    types.forEach(type => {
      const items = filtered.filter(t => t.type === type);
      if(!items.length) return;
      html += `<div class="section-label">${typeLabel[type]||type} (${items.length})</div><div class="grid">`;
      items.forEach(t => { html += cardHTML(t, typeLabel, typeClass); });
      html += '</div>';
    });
  }

  if(!filtered.length) html = '<p style="color:var(--color-text-secondary);font-size:13px;padding:1rem 0">No tools found. Try a different search.</p>';
  document.getElementById('grid').outerHTML = '<div id="grid">' + html.replace(/<div id="grid">/g,'') + '</div>';
  document.getElementById('grid').innerHTML = html;
}

function cardHTML(t, typeLabel, typeClass) {
  return `<div class="card">
    <div class="card-top">
      <span class="card-name">${t.name}</span>
      <span class="badge ${typeClass[t.type]}">${typeLabel[t.type]}</span>
    </div>
    <div class="price">${t.price}</div>
    <div class="desc">${t.desc}</div>
    <a class="link" href="${t.url}" target="_blank">${t.url.replace('https://','')}</a>
  </div>`;
}

render();
</script>
